[package]
name = "Datasoc"
version = "0.1.0"
description = "A Logging app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
sqlite-vec = "0.1.9"
llama-cpp-2 = "0.1.156"
anyhow = "1.0.104"
zerocopy = "0.8.57"
rusqlite = "^0.32.1"
rusqlite_migration = "1.3.1"
tokio = "1.53.1"
